<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>업무수첩 · 데스크 노트</title>
<meta name="theme-color" content="#183c3c">
<meta name="description" content="특수교사가 해마다 하는 업무, 학생 지원 서류, 개별화교육 목표·평가 문구, 관찰 기록을 한 화면에서. 기록은 이 기기 브라우저에만 저장됩니다.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='8' y='6' width='48' height='52' rx='8' fill='%231D2935'/%3E%3Crect x='16' y='18' width='32' height='7' rx='3' fill='%23FFE27A'/%3E%3Crect x='16' y='31' width='26' height='4' rx='2' fill='%23fff'/%3E%3Crect x='16' y='40' width='20' height='4' rx='2' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --paper:#EEF2F5; --sheet:#FFFFFF; --ink:#1D2935; --ink2:#55626E; --ink3:#87939E; --line:#D8E0E6;
  --blue:#2B6CCB; --blue-d:#1D539F; --blue-s:#E3EDFB;
  --mark:#FFE27A; --mark-s:#FFF5CC; --mark-ink:#6E5300;
  --green:#22915C; --green-s:#DFF2E8; --red:#C93C34; --red-s:#FBE6E4;
  --r:14px;
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
a{color:var(--blue-d)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}

/* 틀 */
.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;background:var(--ink);color:#fff;padding:22px 12px;display:flex;flex-direction:column;gap:18px}
.brand{padding:0 10px}
.brand b{display:block;font-size:20px;letter-spacing:-.02em}
.brand b span{background:linear-gradient(transparent 55%,rgba(255,226,122,.55) 55%)}
.brand small{color:#9FB0BF;font-size:12.5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;color:#C6D1DA;text-decoration:none;font-size:15px}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.on{background:#fff;color:var(--ink);font-weight:700}
.nav .ls{display:none}
.nav svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.rail .safe{margin-top:auto;font-size:12px;color:#9FB0BF;padding:0 10px;line-height:1.5}
main{padding:28px 32px 64px;max-width:1200px;width:100%}

/* 머리말 */
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{margin:0;font-size:26px;letter-spacing:-.02em;line-height:1.25}
.ph .sub{color:var(--ink2);margin-top:4px}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
.today-line{font-size:14px;color:var(--ink2);font-weight:600}

/* 학사력 띠 */
.yr{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:8px;margin-bottom:16px}
.yr-row{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px}
.yr-sem{display:grid;grid-template-columns:5fr 7fr;gap:3px;font-size:11.5px;color:var(--ink3);font-weight:600;margin:0 2px 4px}
.yr-sem span{border-bottom:2px solid var(--line);padding:0 4px 2px}
.yr button{border:0;background:transparent;border-radius:9px;padding:7px 0 6px;cursor:pointer;color:var(--ink2);min-width:0}
.yr button:hover{background:var(--paper)}
.yr .mo{display:block;font-weight:800;font-size:15px;color:var(--ink)}
.yr .cnt{display:block;font-size:11px;color:var(--ink3)}
.yr .bar{display:block;height:4px;border-radius:2px;background:var(--line);margin:5px 18% 0;overflow:hidden}
.yr .bar i{display:block;height:100%;background:var(--green)}
.yr .now{background:var(--mark)}
.yr .now:hover{background:var(--mark)}
.yr .now .cnt{color:var(--mark-ink)}

/* 판 */
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel h2{font-size:17px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel h2 .more{font-size:13px;font-weight:600}
.muted{color:var(--ink3)}
.small{font-size:13px}
.empty{color:var(--ink2);background:var(--paper);border-radius:10px;padding:14px;font-size:14px}

/* 목록 */
.item{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .tx{flex:1;min-width:0}
.item .tx .nt{display:block;font-size:12.5px;color:var(--ink3)}
.item.done .tt{text-decoration:line-through;color:var(--ink3)}
.ck{width:22px;height:22px;border:2px solid #A7B2BC;border-radius:6px;flex:none;background:#fff;cursor:pointer;display:grid;place-items:center;padding:0;margin-top:1px}
.ck svg{width:14px;height:14px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
.ck.on{background:var(--green);border-color:var(--green)}
.ck.on svg{opacity:1}
.icon-btn{border:0;background:none;color:var(--ink3);cursor:pointer;padding:3px 5px;border-radius:6px;font-size:13px;flex:none}
.icon-btn:hover{background:var(--paper);color:var(--ink)}
.acts-i{display:flex;gap:2px;flex:none;align-items:center}
.icon-btn.del{font-size:15px;line-height:1;padding:4px 6px}
.icon-btn.del:hover{background:var(--red-s)}
.mcal{display:grid;grid-template-columns:46px repeat(7,minmax(0,1fr));gap:3px;margin-bottom:6px}
.mcal .dw{font-size:12px;font-weight:700;color:var(--ink3);text-align:center;padding:2px 0}
.mcal .month-week-pick{border:1px solid #a6c7b4;background:#e4f1e8;color:#174f44;border-radius:8px;min-height:66px;padding:3px;font:inherit;font-size:12px;font-weight:800;cursor:pointer}
.mcal .month-week-pick:hover,.mcal .month-week-pick:focus-visible{background:#c9e4d3;outline:2px solid #1b514b;outline-offset:1px}
.mcal .month-week-pick.active{background:#1b514b;color:#fff}
.mcal .day-outside{min-height:66px;border-radius:8px;background:#f6f8f5}
.mcal .sun .dn,.mcal .dw.sun{color:var(--red)}
.mcal .sat .dn,.mcal .dw.sat{color:var(--blue)}
.day{border:1px solid var(--line);background:#fff;border-radius:8px;min-height:66px;padding:4px 5px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0;overflow:hidden}
.day:hover{border-color:#9FB0BF}
.day .dn{font-size:13px;font-weight:700;align-self:flex-start;padding:0 4px;border-radius:6px}
.day.today .dn{background:var(--mark);color:var(--mark-ink)}
.day.on{border:2px solid var(--blue);background:var(--blue-s);padding:3px 4px}
.day .ev{font-size:11px;line-height:1.35;background:color-mix(in srgb,var(--c) 16%,#fff);color:var(--ink);border-left:3px solid var(--c);border-radius:4px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.day .ev.dd{text-decoration:line-through;opacity:.55}
.day .evm{font-size:10.5px;color:var(--ink3)}
.day .pips{display:none;gap:2px}
.day .pips i{width:6px;height:6px;border-radius:50%;background:var(--blue)}
.day .pips i.td{background:var(--green)}
.add-row.day-add{grid-template-columns:1fr auto auto;margin-top:8px}
.someday-add{grid-template-columns:1fr auto;margin-top:10px}
.sec-h{font-size:19px;margin:22px 0 10px}
.week-panel{margin-bottom:16px}
.cdot{width:14px;height:14px;border-radius:50%;border:0;padding:0;flex:none;cursor:pointer;background:var(--c);margin-top:4px;position:relative}
.cdot::after{content:'';position:absolute;inset:-6px}
.cdot.none{background:transparent;box-shadow:inset 0 0 0 2px #A7B0B8}
.cdot:hover{transform:scale(1.2)}
.item .cdot{margin-top:5px}
.wi .cdot{width:11px;height:11px;margin-top:4px}
.cdot-s{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--c);vertical-align:-1px;margin-right:5px;flex:none}
.cdot-s.none{background:transparent;box-shadow:inset 0 0 0 2px #A7B0B8}
.cf-bar{margin:-2px 0 10px}
.chip.cf{padding:4px 11px;font-size:13px;display:inline-flex;align-items:center}
#catPop{position:absolute;z-index:60;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(20,30,40,.18);padding:6px;min-width:170px}
#catPop .cp-t{font-size:12px;font-weight:700;color:var(--ink3);padding:4px 8px 6px}
#catPop button{display:flex;align-items:center;width:100%;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px;text-align:left;gap:2px}
#catPop button:hover,#catPop button:focus-visible{background:var(--paper)}
#catPop button b{margin-left:auto;color:var(--blue)}
.cat-radios{display:flex;flex-wrap:wrap;gap:6px}
.cr{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer;font-size:14px}
.cr input{position:absolute;opacity:0;width:1px;height:1px}
.cr:has(input:checked){border:2px solid var(--ink);padding:4px 10px;font-weight:700}
.cr:has(input:focus-visible){outline:3px solid var(--blue);outline-offset:2px}
.flbl{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.cat-row{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.cat-row:first-of-type{border-top:0}
.cat-name{flex:1;min-width:120px;width:auto}
.pal{display:flex;gap:5px;flex-wrap:wrap}
.pal-c{width:34px;height:34px;border-radius:50%;border:0;background:var(--c);cursor:pointer;padding:0}
.pal-c.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}
.tt.ed{cursor:text;border-radius:4px}
.tt.ed:hover{background:var(--mark-s);box-shadow:0 0 0 2px var(--mark-s)}
.ie{font:inherit;font-size:inherit;padding:2px 6px;border:2px solid var(--blue);border-radius:6px;width:100%;min-width:0;flex:1;background:#fff}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{border:1px solid var(--line);border-radius:12px;padding:8px 8px 6px;display:flex;flex-direction:column;min-height:150px;min-width:0;background:#fff;cursor:pointer}
.wd:hover{border-color:#6aa895}
.wd:focus-within{border-color:#087f70}
.wd.wkend{background:#F7F9FB}
.wd.past{opacity:.75}
.wd.today{border:2px solid var(--ink);padding:7px 7px 5px;opacity:1}
.wh{display:flex;align-items:center;gap:4px;font-size:13.5px;margin-bottom:4px;flex-wrap:wrap}
.week-day-head{border:0;background:none;color:inherit;font:inherit;text-align:left;padding:0;width:100%;cursor:pointer}
.week-day-head:focus-visible{outline:2px solid #087f70;outline-offset:3px;border-radius:3px}
.wh .sun{color:var(--red)} .wh .sat{color:var(--blue)}
.wh .wdn{color:var(--ink2);font-weight:600}
.wh .wc{margin-left:auto;font-size:11.5px;font-weight:800;background:var(--ink);color:#fff;border-radius:999px;padding:0 7px}
.wl{flex:1}
.wi{display:flex;gap:5px;align-items:flex-start;padding:3px 0;font-size:13.5px;line-height:1.35}
.wi .tt{flex:1;min-width:0}
.wi.done .tt{text-decoration:line-through;color:var(--ink3)}
.wi .icon-btn.del{padding:1px 3px;font-size:12px;opacity:.55}
.wi:hover .icon-btn.del{opacity:1}
.ck.sm{width:18px;height:18px;border-radius:5px}
.ck.sm svg{width:11px;height:11px}
.wempty{font-size:12px;color:var(--ink3);padding:2px 0}
.wadd{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;cursor:auto}
.wadd input{padding:5px 7px;font-size:13px;border-radius:7px;min-width:0;flex:1 1 100%}
.wadd button{flex:1;min-height:32px}
.tg{display:flex;justify-content:space-between;font-size:13px;font-weight:800;color:var(--ink2);margin:12px 0 2px;padding-bottom:3px;border-bottom:2px solid var(--line)}
.tg span{color:var(--ink3);font-weight:700}
.tg.late{color:var(--red);border-color:var(--red-s)}
.tg.now{color:var(--mark-ink);border-color:var(--mark)}
.yr .sel{box-shadow:inset 0 0 0 2px var(--ink)}

.tag{display:inline-block;font-size:12px;line-height:1.5;padding:1px 8px;border-radius:999px;background:var(--blue-s);color:var(--blue-d);font-weight:700;white-space:nowrap;vertical-align:1px}
.tag.red{background:var(--red-s);color:var(--red)}
.tag.y{background:var(--mark);color:var(--mark-ink)}
.tag.g{background:var(--green-s);color:var(--green)}
.tag.gr{background:var(--paper);color:var(--ink2)}

/* 버튼·입력 */
.btn{border:0;border-radius:10px;padding:10px 15px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff;display:inline-flex;gap:6px;align-items:center;justify-content:center;text-decoration:none;font-size:15px;line-height:1.3}
.btn:hover{background:var(--blue-d)}
.btn.ghost{background:var(--sheet);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--paper)}
.btn.danger{background:var(--red)}
.btn.sm{padding:6px 11px;font-size:13.5px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;padding:9px 11px;border:1px solid #C9D3DB;border-radius:9px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:64px;resize:vertical}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:4px}
.hint{font-size:12.5px;color:var(--ink3);margin-top:4px}
.add-row{display:grid;grid-template-columns:1fr 150px auto;gap:8px;margin-bottom:6px}

/* 안내 띠 */
.note{border-radius:var(--r);padding:16px 18px;margin-bottom:16px;border:1px solid}
.note.welcome{background:var(--sheet);border-color:var(--ink);border-width:2px}
.note.warn{background:var(--mark-s);border-color:#F0D77A}
.note h2{margin:0 0 6px;font-size:18px}
.note ul{margin:6px 0 12px;padding-left:20px}
.note li{margin:2px 0}

/* 달력 */
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.month{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.month.now{border:2px solid var(--ink)}
.month h3{margin:0 0 4px;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.month.now h3 .mn{background:linear-gradient(transparent 55%,var(--mark) 55%)}

/* 학생 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.st{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.st .nm{font-size:19px;font-weight:800;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.st dl{margin:0;display:grid;grid-template-columns:62px 1fr;gap:3px 8px;font-size:13.5px}
.st dt{color:var(--ink3);font-weight:600}
.st dd{margin:0;min-width:0}
.st .row{margin-top:auto;padding-top:4px}

/* 대화상자 */
dialog{border:0;border-radius:16px;padding:0;width:min(660px,94vw);max-height:92vh;color:var(--ink)}
dialog::backdrop{background:rgba(20,30,40,.5)}
dialog form{display:flex;flex-direction:column;max-height:92vh}
.dlg-h{padding:16px 20px;border-bottom:1px solid var(--line);font-weight:800;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.dlg-b{padding:8px 20px 12px;overflow:auto}
.dlg-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dlg-f .left{margin-right:auto}
.sec-t{font-size:14px;font-weight:800;color:var(--blue-d);margin:16px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}

/* 서류 */
.doc-types{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-bottom:14px}
.doc-types button{border:1px solid var(--line);background:var(--sheet);border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer}
.doc-types button b{display:block;font-size:15px}
.doc-types button span{font-size:12.5px;color:var(--ink2)}
.doc-types button.on{border:2px solid var(--blue);background:var(--blue-s);padding:11px 13px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid #C3CED7;background:var(--sheet);border-radius:999px;padding:6px 13px;cursor:pointer;font-weight:600;font-size:14px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.paper{background:#fff;border:1px solid var(--line);border-radius:10px;padding:26px;overflow-x:auto}

.doc h2.doc-title{font-size:20px;margin:0 0 4px}
.doc .doc-meta{font-size:13px;color:#566;margin-bottom:14px}
.doc-card{border:2px solid #1D2935;border-radius:10px;padding:14px 16px;margin-bottom:16px;break-inside:avoid;page-break-inside:avoid}
.doc-card h3{margin:0 0 6px;font-size:18px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.doc-card h3 small{font-size:13px;color:#566;font-weight:600}
.doc-row{display:grid;grid-template-columns:128px 1fr;gap:10px;padding:6px 0;border-top:1px solid #D5DCE2;font-size:14px}
.doc-row b{color:#2D3A46}
.doc-row.key{background:#FFF7D6;margin:0 -8px;padding:7px 8px;border-radius:6px;border-top:0}
.nil{color:#A0AAB3}
table.doc-t{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
table.doc-t th,table.doc-t td{border:1px solid #9AA6B1;padding:7px 9px;text-align:left;vertical-align:top}
table.doc-t th{background:#EEF2F5;font-weight:700}
table.doc-t td.sign{width:70px}
.routine{white-space:pre-wrap;background:#F6F8FA;border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:14px}

/* IEP */
.iep{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;align-items:start}
.goal-list{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.goal-list button{border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:9px 11px;text-align:left;cursor:pointer;font-size:14px}
.goal-list button small{display:block;color:var(--ink3);font-size:12px;font-weight:700}
.goal-list button.on{border:2px solid var(--blue);background:var(--blue-s);padding:8px 10px}
.crit{display:grid;grid-template-columns:1fr auto 1fr auto;gap:6px;align-items:center}
.out{background:var(--paper);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.out .lbl{font-size:12.5px;font-weight:800;color:var(--ink2);display:flex;justify-content:space-between;align-items:center;gap:8px}
.out p{margin:5px 0 0;font-size:15.5px;white-space:pre-line}
.out.rec{background:var(--mark-s);outline:2px solid #EBCB55}
.data-box{border:1px dashed #B7C3CD;border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:14px}

/* 관찰 */
.goal-card{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.goal-card h3{margin:0;font-size:16.5px}
.goal-card .gmeta{font-size:13px;color:var(--ink2);margin:2px 0 10px}
.lvs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.lv{border:0;border-radius:12px;padding:13px 4px;font-weight:800;color:#fff;cursor:pointer;font-size:15px;line-height:1.2}
.lv small{display:block;font-size:11px;font-weight:600;opacity:.9;margin-top:2px}

function toast(msg, undo){
  const t = $('#toast'); t.textContent = msg; t.classList.toggle('act', !!undo);
  if (undo){
    const b = document.createElement('button'); b.textContent = '되돌리기'; b.className = 'undo';
    b.onclick = ev => { ev.stopPropagation(); undo(); t.classList.remove('show'); };
    t.appendChild(b);
  }
  t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), undo ? 5000 : 2200);
}

function ask(msg, ok = '확인', danger = true){
  return new Promise(res => {
    const d = $('#ask');
    d.innerHTML = `<div class="ask-b">${esc(msg).replace(/\n/g,'<br>')}</div>
      <div class="dlg-f"><button type="button" class="btn ghost" data-ans="0">취소</button><button type="button" class="btn ${danger?'danger':''}" data-ans="1">${esc(ok)}</button></div>`;
    const done = v => { d.close(); res(v); };
    d.querySelector('[data-ans="0"]').onclick = ev => { ev.stopPropagation(); done(false); };
    d.querySelector('[data-ans="1"]').onclick = ev => { ev.stopPropagation(); done(true); };
    d.oncancel = ev => { ev.preventDefault(); done(false); };
    d.showModal(); d.querySelector('[data-ans="1"]').focus();
  });
}
async function copyText(text){
  try { await navigator.clipboard.writeText(text); toast('복사했어요'); }
  catch(e){
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try { toast(document.execCommand('copy') ? '복사했어요' : '복사가 안 돼요. 글을 직접 선택해 주세요'); } catch(_) { toast('복사가 안 돼요. 글을 직접 선택해 주세요'); }
    ta.remove();
  }
}

function goalSentence(g){
  const t = (g.text || '').trim();
  return t && !/[.!?。]$/.test(t) ? t + '.' : t;
}
const RECENT = 10;
function goalStats(g){
  const all = obsOf(g.id);
  const last = all.slice(-RECENT);
  const by = LV.map((_,i) => last.filter(o => o.l === i).length);

function composeEvaluation(f){
  const context = String(f.evalContext || '').trim().replace(/[.!?。]+$/,'');
  const action = String(f.evalAction || '').trim().replace(/[.!?。]+$/,'');
  return context && action ? `${context} ${action}.` : '';
}
function evaluationChecks(f){
  const notes = [];
  const goal = String(f.text || '').trim();
  const evalText = String(f.evaluation || '').trim();
  if (goal && /수\s*있/.test(goal)) notes.push('학기 목표는 ‘~할 수 있다’ 대신 ‘~한다.’처럼 써 주세요.');
  else if (goal && !/다\.$/.test(goalSentence(f))) notes.push('학기 목표의 끝맺음을 ‘~한다.’ 형태로 확인해 주세요.');
  if (!evalText) return notes;
  if (!evalText.endsWith('.')) notes.push('평가 문장은 마침표로 마무리해 주세요.');
  const last = evalText.replace(/[.!?。\s]+$/,'').at(-1);
  const code = last ? last.charCodeAt(0) : 0;
  if (code < 0xAC00 || code > 0xD7A3 || (code - 0xAC00) % 28 !== 16) notes.push('평가의 끝맺음을 ‘~함.’ 형태로 확인해 주세요.');
  if (/도움을 받아|지원을 받아|촉진을 받아|촉구를 받아|교사와 함께|어려움|못함|안 함|불가능|필요함|이해함|익힘|파악함|수\s*있음|해 봄|하기를 함/.test(evalText)) notes.push('실제로 관찰한 학생의 행동을 중심으로 쓰고 부정적·수동적·추상적 표현을 살펴봐 주세요.');
  if (evalText.includes(',')) notes.push('쉼표는 3개 이상을 나열할 때만 사용해 주세요.');
  if (/[·“”‘’○△□/+%=~()<>!?;:]/.test(evalText)) notes.push('나이스 입력 전 특수문자를 확인해 주세요. 마침표와 필요한 쉼표만 사용합니다.');
  return notes;
}

function eventsMap(){

function todoGroups(todos){
  const t = todayStr(), groups = new Map();
  todos.forEach(x => {
    let g;
    if (!x.date) g = '날짜 없음';
    else { const n = dayDiff(x.date); g = n < 0 && !x.done ? '날짜 지남' : n === 0 ? '오늘' : n === 1 ? '내일' : fmtMDw(x.date); }
    if (!groups.has(g)) groups.set(g, []); groups.get(g).push(x);
  });
  const order = k => k === '날짜 지남' ? 0 : k === '오늘' ? 1 : k === '내일' ? 2 : k === '날짜 없음' ? 9 : 3;
  return [...groups.entries()].sort((a,b) => order(a[0]) - order(b[0]) || (a[1][0].date||'').localeCompare(b[1][0].date||''))
    .map(([g,l]) => `<div class="tg ${g==='날짜 지남'?'late':g==='오늘'?'now':''}">${g}<span>${l.length}</span></div>${l.map(todoRow).join('')}`).join('');
}

function exportIcs(){
  const t = todayStr(), items = [];
  S.tasks.forEach(x => { const d = taskDate(x); if (d && d >= t && !isDone(x.id)) items.push({id:x.id, d, title:x.title, note:x.note}); });
  S.todos.forEach(x => { if (x.date && x.date >= t && !x.done) items.push({id:x.id, d:x.date, title:x.text}); });
  if (!items.length){ toast('보낼 일정이 없어요. 날짜가 있는 할 일이나 업무를 먼저 적어 주세요'); return; }
  const ic = v => String(v||'').replace(/\\/g,'\\\\').replace(/[,;]/g, m => '\\' + m).replace(/\n/g,'\\n');
  const dd = s => s.replace(/-/g,'');
  const next = s => { const x = parseYmd(s); x.setDate(x.getDate()+1); return dd(ymd(x)); };
  const stamp = new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//tdesk//KO','CALSCALE:GREGORIAN','X-WR-CALNAME:업무수첩'];
  items.forEach(it => lines.push('BEGIN:VEVENT', `UID:${it.id}-${dd(it.d)}@tdesk`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${dd(it.d)}`, `DTEND;VALUE=DATE:${next(it.d)}`,
    `SUMMARY:${ic(it.title)}`, ...(it.note ? [`DESCRIPTION:${ic(it.note)}`] : []),
    'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${ic(it.title)}`,'TRIGGER:-PT15H','END:VALARM','END:VEVENT'));
  lines.push('END:VCALENDAR');
  const blob = new Blob([lines.join('\r\n')], {type:'text/calendar'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `업무수첩-일정-${dd(t)}.ics`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast(`일정 ${items.length}개를 캘린더 파일로 받았어요`);
}

/* ===== IEP 문구 ===== */
function blankForm(){ return {subj:'국어', text:'', method:'관찰 평가', evalContext:'', evalAction:'', evaluation:''}; }
function vIep(){
  const ss = S.students;
  if (ui.iepSid && !stu(ui.iepSid)) ui.iepSid = null;
  if (!ui.iepSid && ss.length) ui.iepSid = ss[0].id;
  const s = stu(ui.iepSid);
  if (ui.iepGid !== 'new' && !goalOf(s, ui.iepGid)) { ui.iepGid = 'new'; ui.form = null; }
  if (!ui.form) ui.form = ui.iepGid === 'new' ? blankForm() : {...goalOf(s, ui.iepGid)};
  const f = ui.form;
  return `<header class="ph"><div><h1>IEP 목표·평가 문구</h1><div class="sub">교육 목표를 적고 실제로 관찰한 활동과 행동으로 평가 문구를 작성해요.</div></div></header>
  <div class="iep">
    <aside class="panel">
      ${ss.length ? `<label class="f" style="margin:0"><span>학생</span><select data-act="iepStu">${ss.map(x => `<option value="${x.id}" ${x.id===ui.iepSid?'selected':''}>${esc(x.alias)}</option>`).join('')}</select></label>
      <div class="goal-list">${(s.goals||[]).map(g => `<button class="${ui.iepGid===g.id?'on':''}" data-act="iepGoal" data-id="${g.id}"><small>${esc(g.subj)}</small>${esc(g.text)}</button>`).join('')}
        <button class="${ui.iepGid==='new'?'on':''}" data-act="iepGoal" data-id="new"><small>새 목표</small>새로 만들기</button></div>`
      : `<div class="empty">학생이 아직 없어요. 오른쪽에서 학생 별칭과 교육 목표를 적으면 함께 저장돼요.</div>`}
    </aside>
    <div class="col">
      <section class="panel">
        <form id="iepForm" data-form="iep">

            <div class="hint">실명 대신 번호나 별칭을 권장해요. 자세한 학생 정보는 나중에 카드에서 적을 수 있어요.</div></label>` : ''}
          <div class="two">
            <label class="f"><span>교과·영역</span><select name="subj">${SUBJECTS.map(x => `<option ${x===f.subj?'selected':''}>${x}</option>`).join('')}</select></label>
            <label class="f"><span>평가 방법</span><select name="method">${METHODS.map(x => `<option ${x===f.method?'selected':''}>${x}</option>`).join('')}</select></label>
          </div>
          <label class="f"><span>교육 목표</span><input name="text" value="${esc(f.text)}" placeholder="예: 자신의 이름을 보고 쓴다." autocomplete="off">
            <div class="hint" id="textHint">학생의 현행 수준에 맞는 관찰 가능한 목표를 ‘~한다.’ 형태로 적어 주세요.</div></label>
          <div class="sec-t">실제로 관찰한 내용</div>
          <div class="hint" style="margin-bottom:12px">목표만으로 평가를 만들지 않아요. 학생이 참여한 활동과 실제로 한 행동을 적어 주세요.</div>
          <label class="f"><span>활동·상황</span><input name="evalContext" value="${esc(f.evalContext||'')}" placeholder="예: 교실 물건 그림을 보고" autocomplete="off"></label>
          <label class="f"><span>학생의 행동·표현</span><input name="evalAction" value="${esc(f.evalAction||'')}" placeholder="예: 해당 물건을 가리키며 이름을 말함" autocomplete="off">

          <div class="row" style="margin-bottom:13px"><button class="btn ghost" type="button" data-act="makeEval">관찰 내용으로 문장 만들기</button></div>

          <div class="row">
            <button class="btn" type="submit">${!ss.length ? '학생과 목표 함께 저장' : ui.iepGid==='new' ? `${esc(s.alias)} 목표·평가 저장` : '고친 내용 저장'}</button>
            ${ui.iepGid!=='new' ? `<button class="btn ghost" type="button" data-act="goalDel">목표 지우기</button><button class="btn ghost" type="button" data-act="obsGo" data-id="${s.id}">관찰 기록하러 가기</button>` : ''}
          </div>
        </form>
      </section>
      ${!storageOk ? `<section class="note warn"><b>이 창에서는 자동 저장이 안 돼요.</b> 일반 브라우저에서 파일을 열어 사용하거나 설정에서 백업 파일을 받아 주세요.</section>` : ''}
      <section class="panel"><h2>문구 검토</h2><div id="iepOut">${iepOut()}</div></section>

function iepOut(){
  const f = ui.form;
  const g = {...f, text: f.text || ''};
  if (!g.text.trim() && !(g.evaluation||'').trim()) return `<div class="empty">교육 목표와 관찰 내용을 적으면 이곳에서 검토할 수 있어요.</div>`;
  const s = stu(ui.iepSid), saved = ui.iepGid !== 'new' ? goalOf(s, ui.iepGid) : null;
  const st = saved ? goalStats({...g, id:saved.id}) : null;
  const box = (lbl, txt, cls='', liveCopy=false) => `<div class="out ${cls}"><div class="lbl"><span>${lbl}</span><button type="button" class="btn sm ghost" data-act="${liveCopy?'copyEval':'copyOut'}" ${liveCopy?'':`data-t="${esc(txt)}"`}>복사</button></div><p>${esc(txt)}</p></div>`;
  let html = g.text.trim() ? box('교육 목표', goalSentence(g)) : '';
  if (st){
    const lastDots = st.last.map(o => `<span class="dot" title="${LV[o.l].full}" style="background:${LV[o.l].c}"></span>`).join('');
    const summary = LV.map((l,i) => st.by[i] ? `${l.full} ${st.by[i]}회` : '').filter(Boolean).join(' · ');
    html += `<div class="data-box"><b>도움 수준 기록</b> 전체 ${st.all.length}회${st.last.length ? ` · 최근 ${st.last.length}회: ${summary}` : ' · 아직 기록이 없어요'}
      ${st.last.length ? `<div class="dots" style="margin-top:6px">${lastDots}</div>` : ''}<div class="hint">이 횟수만으로 달성 여부나 평가 문장을 결정하지 않아요.</div></div>`;
  }
  html += (g.evaluation||'').trim() ? box('평가 문구 초안', g.evaluation.trim(), 'rec', true)
    : `<div class="empty">평가 문구는 아직 없어요. 실제 관찰한 내용을 적어 주세요.</div>`;
  const notes = evaluationChecks(g);
  if (notes.length) html += `<div class="note warn iep-check"><b>확인할 점</b><ul>${notes.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`;
  html += `<div class="hint">2026학년도 나이스 작성 기준 참고 · 참여 과정과 관찰 가능한 행동을 쉬운 우리말로 구체적으로 적고 마지막에는 학생의 실제 수행과 오탈자를 확인해 주세요. 학교생활기록부에는 그대로 옮기지 말고 해당 기재 기준에 맞게 다시 검토하세요.</div>`;
  return html;
}
function saveIepGoal(data){
  const s = stu(ui.iepSid);
  if (!s){ toast('저장할 학생을 먼저 추가해 주세요'); return false; }
  const g = {id:data.id, subj:data.subj||'국어', text:String(data.text||'').trim(), method:data.method||'관찰 평가',
    evalContext:String(data.evalContext||'').trim(), evalAction:String(data.evalAction||'').trim(), evaluation:String(data.evaluation||'').trim()};
  if (!g.text){ toast('교육 목표를 먼저 적어 주세요'); return false; }
  if (ui.iepGid === 'new'){
    g.id = uid(); s.goals = [...(s.goals||[]), g]; ui.iepGid = g.id;
  } else {
    const i = (s.goals||[]).findIndex(x => x.id === ui.iepGid);
    if (i < 0){ toast('저장할 목표를 찾지 못했어요. 다시 선택해 주세요'); return false; }
    g.id = ui.iepGid; s.goals[i] = g;
  }
  ui.form = {...g};
  const stored = save();
  toast(stored ? '목표와 평가 문구를 저장했어요' : '이 창에는 저장할 수 없어요. 일반 브라우저에서 다시 열어 주세요');
  render();
  return true;
}

/* ===== 관찰 기록 ===== */
function weekStart(d){ const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - (x.getDay()+6)%7); return x; }
function weekChart(g){
  const obs = obsOf(g.id); const W = 8; const ws = weekStart(new Date());
  const weeks = [];
  for (let i = W-1; i >= 0; i--){ const s = new Date(ws); s.setDate(s.getDate() - i*7); weeks.push(s); }
  const data = weeks.map(s => { const e = new Date(s); e.setDate(e.getDate()+7);
    const o = obs.filter(x => x.t >= s.getTime() && x.t < e.getTime()); return {s, n:o.length, ok:o.filter(x => x.l === 0).length}; });
  const w = 320, h = 104, bw = w / W;
  return `<svg class="chart" viewBox="0 -14 ${w} ${h+44}" role="img" aria-label="최근 8주 스스로 한 비율">
    <line x1="0" y1="${h}" x2="${w}" y2="${h}" stroke="#C9D3DB"/>
    ${data.map((d,i) => { const p = d.n ? d.ok/d.n : 0; const bh = Math.max(d.n?3:0, p*h);
      return `<rect x="${i*bw+7}" y="${h-bh}" width="${bw-14}" height="${bh}" rx="3" fill="${d.n?'#2B6CCB':'#fff'}"/>
      ${d.n?`<text x="${i*bw+bw/2}" y="${h-bh-4}" font-size="10" text-anchor="middle" fill="#55626E">${Math.round(p*100)}%</text>`:''}
      <text x="${i*bw+bw/2}" y="${h+14}" font-size="10" text-anchor="middle" fill="#87939E">${d.s.getMonth()+1}/${d.s.getDate()}</text>
      <text x="${i*bw+bw/2}" y="${h+26}" font-size="9" text-anchor="middle" fill="#A9B3BC">${d.n?d.n+'회':''}</text>`; }).join('')}
  </svg>`;
}
function behChart(sid, label){
  const days = []; const base = parseYmd(todayStr());
  for (let i = 9; i >= 0; i--){ const d = new Date(base); d.setDate(d.getDate()-i); days.push(ymd(d)); }
  const counts = days.map(d => S.beh.filter(b => b.sid===sid && b.label===label && b.d===d).length);
  const max = Math.max(3, ...counts), w = 200, h = 40, bw = w/10;
  return `<svg class="chart" viewBox="0 0 ${w} ${h+12}" style="max-width:220px" role="img" aria-label="최근 10일 ${esc(label)} 횟수">
    ${counts.map((c,i) => `<rect x="${i*bw+3}" y="${h - (c/max)*h}" width="${bw-6}" height="${(c/max)*h}" rx="2" fill="${i===9?'#C93C34':'#E8A19B'}"/>`).join('')}
    <line x1="0" y1="${h}" x2="${w}" y2="${h}" stroke="#C9D3DB"/>
    <text x="0" y="${h+11}" font-size="9" fill="#87939E">${fmtMD(days[0])}</text><text x="${w}" y="${h+11}" font-size="9" text-anchor="end" fill="#87939E">오늘</text></svg>`;
}
function vObs(){
  const ss = S.students;
  if (ui.obsSid && !stu(ui.obsSid)) ui.obsSid = null;
  if (!ui.obsSid && ss.length) ui.obsSid = ss[0].id;
  const s = stu(ui.obsSid), t = todayStr();
  if (!ss.length) return `<header class="ph"><div><h1>관찰 기록</h1></div></header><div class="panel"><div class="empty">학생 카드와 개별화 목표가 있으면 수업 중에 버튼 하나로 기록할 수 있어요.</div><div class="row" style="margin-top:10px"><button class="btn sm" data-act="stuNew">학생 추가</button><button class="btn sm ghost" data-act="demoAdd">예시 학생 넣기</button></div></div>`;
  const goals = s.goals || [], tracks = trackList(s);
  return `<header class="ph"><div><h1>관찰 기록</h1><div class="sub">수업 중에 학생이 보인 도움 수준을 누르면 한 번으로 기록돼요.</div></div></header>
  <div class="chips" style="margin-bottom:14px" role="tablist" aria-label="학생">${ss.map(x => `<button class="chip ${x.id===ui.obsSid?'on':''}" role="tab" aria-selected="${x.id===ui.obsSid}" data-act="obsStu" data-id="${x.id}">${esc(x.alias)}</button>`).join('')}</div>
  ${goals.length ? goals.map(g => {
    const all = obsOf(g.id), today = all.filter(o => o.d === t), last = all.slice(-20);
    const st = goalStats(g);
    return `<section class="goal-card">
      <h3>${esc(goalSentence(g))}</h3>
      <div class="gmeta">${esc(g.subj)} · 오늘 ${today.length}회 · 전체 ${all.length}회${st.last.length?` · 최근 ${st.last.length}회 중 스스로 ${st.ind}회`:''}</div>
      <div class="lvs">${LV.map((l,i) => `<button class="lv" style="background:${l.c}" data-act="rec" data-g="${g.id}" data-l="${i}">${l.short}</button>`).join('')}</div>
      <div class="obs-foot">
        <div><div class="small muted" style="margin-bottom:4px">최근 기록 ${last.length ? `(${last.length}회)` : ''}</div>
          <div class="dots">${last.length ? last.map(o => `<span class="dot" title="${fmtMD(o.d)} ${LV[o.l].full}" style="background:${LV[o.l].c}"></span>`).join('') : '<span class="small muted">아직 기록이 없어요</span>'}</div>
          <div class="row" style="margin-top:8px">${all.length ? `<button class="btn sm ghost" data-act="recUndo" data-g="${g.id}">마지막 기록 지우기</button>` : ''}<button class="btn sm ghost" data-act="iepGoalGo" data-sid="${s.id}" data-id="${g.id}">평가 문구 보기</button></div></div>
        <div><div class="small muted">주별 스스로 한 비율</div>${weekChart(g)}</div>
      </div></section>`;
  }).join('') : `<div class="panel" style="margin-bottom:12px"><div class="empty">${esc(s.alias)} 학생의 개별화 목표가 아직 없어요. IEP 문구에서 목표를 만들면 여기서 기록할 수 있어요.</div><div class="row" style="margin-top:10px"><button class="btn sm" data-act="iepGo" data-id="${s.id}">목표 만들기</button></div></div>`}
  <div class="legend">${LV.map(l => `<span><i style="background:${l.c}"></i>${l.full}</span>`).join('')}</div>
  <section class="panel" style="margin-top:14px"><h2>행동 횟수 <span class="small muted">오늘</span></h2>
    ${tracks.length ? tracks.map(lb => {
      const n = S.beh.filter(b => b.sid===s.id && b.label===lb && b.d===t).length;
      return `<div class="beh"><div style="flex:1;min-width:0"><b>${esc(lb)}</b>${behChart(s.id, lb)}</div>
        <div class="row"><button class="btn sm ghost" data-act="behUndo" data-l="${esc(lb)}" ${n?'':'disabled'} aria-label="${esc(lb)} 한 번 빼기">−1</button>
        <span class="n">${n}</span><button class="btn" data-act="behAdd" data-l="${esc(lb)}" aria-label="${esc(lb)} 한 번 더하기">+1</button></div></div>`;
    }).join('') : `<div class="empty">학생 카드의 ‘관찰 기록할 행동’에 쉼표로 적으면 여기서 횟수를 셀 수 있어요. <button class="btn sm ghost" data-act="stuEdit" data-id="${s.id}">학생 카드 수정</button></div>`}
  </section>`;
}

/* ===== 바로 수정 ===== */
function startInline(span){
  if (span.querySelector('input')) return;
  const k = span.dataset.k, id = span.dataset.id;
  const obj = k === 'task' ? S.tasks.find(t => t.id === id) : S.todos.find(t => t.id === id);
  if (!obj) return;
  const old = k === 'task' ? obj.title : obj.text;
  const inp = document.createElement('input');
  inp.className = 'ie'; inp.value = old; inp.setAttribute('aria-label', '내용 수정');
  span.replaceWith(inp); inp.focus(); inp.select();
  let finished = false, pending = false;
  const finish = (saveIt) => {
    if (finished) return; finished = true;
    const v = inp.value.trim();
    if (saveIt && v && v !== old){
      if (k === 'task') obj.title = v; else obj.text = v;
      save(); toast('수정했어요');
    }
    render();
  };
  inp.addEventListener('keydown', e => {
    e.stopPropagation();
    if (e.key === 'Escape'){ e.preventDefault(); finish(false); return; }
    if (e.key === 'Enter' || e.keyCode === 229){
      if (e.isComposing || e.keyCode === 229){ if (e.key === 'Enter') pending = true; return; }
      e.preventDefault(); finish(true);
    }
  });
  inp.addEventListener('compositionend', () => { if (pending){ pending = false; setTimeout(() => finish(true), 0); } });
  inp.addEventListener('blur', () => setTimeout(() => finish(true), 0));
  inp.addEventListener('click', e => e.stopPropagation());
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeCatPop(); ui._popFor = null; } });
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.tt.ed')){ e.preventDefault(); startInline(e.target); }
});

}

    case 'behUndo': { const t = todayStr(); const list = S.beh.filter(x => x.sid===ui.obsSid && x.label===b.dataset.l && x.d===t).sort((p,q) => p.t-q.t);
      const last = list[list.length-1]; if (last){ S.beh = S.beh.filter(x => x.id !== last.id); save(); render(); } break; }
    case 'export': exportData(); break;
    case 'import': $('#importFile').click(); break;
    case 'wipe': if (await ask('이 기기에 저장된 학생 카드, 관찰 기록, 할 일, 업무 달력을 모두 지울까요? 되돌릴 수 없어요.', '모두 지우기')) {
        try { localStorage.removeItem(KEY); } catch(_){}
        S = fresh(); ui = {homeMonth:null, catFilter:null, calendarMode:'month', docType:'beh', docSel:null, iepSid:null, iepGid:'new', form:null, obsSid:null, focusMonth:null}; save(); toast('모두 지웠어요'); go('home'); } break;
  }
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.act === 'iepStu'){ ui.iepSid = el.value; ui.iepGid = 'new'; ui.form = null; render(); return; }
  if (el.dataset && el.dataset.catName){ const c = S.cats.find(x => x.id === el.dataset.catName); if (c){ c.name = el.value.trim() || c.name; save(); toast('저장했어요'); render(); } return; }
  const f = el.closest('form[data-form="settings"]');
  if (f){ S.settings[el.name] = el.value; save(); toast('저장했어요'); }
});
document.addEventListener('input', e => {
  const f = e.target.closest('form[data-form="iep"]');
  if (f){
    const fd = new FormData(f);
    ui.form = {...ui.form, subj:fd.get('subj'), method:fd.get('method'), text:fd.get('text'),
      evalContext:fd.get('evalContext'), evalAction:fd.get('evalAction'), evaluation:fd.get('evaluation')};
    $('#iepOut').innerHTML = iepOut();
  }
});

/* 입력 처리: 미리보기 창처럼 폼 제출이 막힌 곳에서도, 한글 입력 중 Enter에서도 동작하도록 직접 처리 */
let lastForm = {f:null, t:0};
function submitForm(f){
  const now = Date.now();
  if (lastForm.f === f && now - lastForm.t < 400) return;   // 같은 입력이 두 번 들어가지 않게
  lastForm = {f, t:now};
  handleForm(f);
}
document.addEventListener('submit', e => {
  const f = e.target; if (!f.dataset || !f.dataset.form) return;
  e.preventDefault(); submitForm(f);
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.keyCode !== 13 && e.keyCode !== 229) return;
  const el = e.target;
  if (!el || el.tagName !== 'INPUT' || ['checkbox','radio','file','button','submit'].includes(el.type)) return;
  const f = el.closest('form[data-form]'); if (!f || f.dataset.form === 'settings') return;
  if (e.isComposing || e.keyCode === 229){
    if (e.key === 'Enter'){ f._pendingEnter = true; }   // 한글 조합 중 Enter → 조합이 끝나면 처리
    return;
  }
  e.preventDefault(); submitForm(f);
});
document.addEventListener('compositionend', e => {
  const f = e.target && e.target.closest && e.target.closest('form[data-form]');
  if (f && f._pendingEnter){ f._pendingEnter = false; setTimeout(() => submitForm(f), 0); }
});
document.addEventListener('click', e => {
  const btn = e.target.closest('button[type="submit"]'); if (!btn) return;
  const f = btn.closest('form[data-form]'); if (!f) return;
  e.preventDefault(); submitForm(f);
});
function handleForm(f){
  const kind = f.dataset.form; if (!kind) return;
  const fd = new FormData(f);
  if (kind === 'todo'){
    const text = (fd.get('text')||'').trim(); if (!text){ toast('할 일을 적어 주세요'); return; }
    S.todos.push({id:uid(), text, date:fd.get('date')||'', done:false, cat:ui.catFilter && ui.catFilter!=='none' ? ui.catFilter : ''}); save(); render();
    const inp = document.querySelector('form[data-form="todo"] input[name="text"]'); if (inp) inp.focus();
  } else if (kind === 'todoSchedule'){
    const todo = S.todos.find(x => x.id === f.dataset.id), date = String(fd.get('date')||'');
    if (!todo || !/^\d{4}-\d{2}-\d{2}$/.test(date)){ toast('날짜를 골라 주세요'); return; }
    const changing = !!todo.date; todo.date = date; save(); closeDlg(); toast(changing?'날짜를 바꿨어요':'달력에 넣었어요'); render();
  } else if (kind === 'dayTodo'){
    const text = (fd.get('text')||'').trim(); if (!text){ toast('할 일을 적어 주세요'); return; }
    const date = f.dataset.date, wadd = f.classList.contains('wadd');
    const requestedCat = String(fd.get('cat')||'');
    const cat = S.cats.some(c => c.id === requestedCat) ? requestedCat : '';
    ui.lastDayCat = cat;
    if (wadd) ui.weekEntryDate = null;
    S.todos.push({id:uid(), text, date, done:false, cat});
    if (ui.catFilter && (ui.catFilter === 'none' ? !!cat : ui.catFilter !== cat)) ui.catFilter = cat || 'none';
    save(); toast('할 일을 추가했어요'); render();
    const next = wadd ? null : document.querySelector(`form[data-form="dayTodo"][data-date="${date}"]:not(.wadd) input[name=text]`);
    if (next) next.focus();
  } else if (kind === 'task'){
    const title = (fd.get('title')||'').trim(); if (!title){ toast('업무 이름을 적어 주세요'); return; }
    const due = fd.get('due') ? fd.get('due').slice(5) : '';
    const data = {title, m: due ? +due.slice(0,2) : +fd.get('m'), due, note:(fd.get('note')||'').trim(), cat:fd.get('cat')||''};
    if (f.dataset.id){ Object.assign(S.tasks.find(t => t.id === f.dataset.id), data); }
    else S.tasks.push({id:uid(), ...data});
    save(); closeDlg(); toast('저장했어요'); render();
  } else if (kind === 'stu'){
    const alias = (fd.get('alias')||'').trim(); if (!alias){ toast('부르는 이름을 적어 주세요'); return; }
    const data = {}; FIELDS.forEach(x => { if (x.k) data[x.k] = (fd.get(x.k)||'').trim(); });
    if (f.dataset.id){ Object.assign(stu(f.dataset.id), data); }
    else { const s = {id:uid(), goals:[], ...data}; S.students.push(s); if (!S.createdAt) S.createdAt = todayStr(); }
    S.welcomed = true; save(); closeDlg(); toast('저장했어요'); render();
  } else if (kind === 'iep'){
    const text = (fd.get('text')||'').trim();
    if (!text){ toast('교육 목표를 먼저 적어 주세요'); return; }
    if (!stu(ui.iepSid)){
      const alias = (fd.get('studentAlias')||'').trim();
      if (!alias){ toast('학생 별칭을 먼저 적어 주세요'); return; }
      const s = {id:uid(), alias, goals:[]};
      S.students.push(s); if (!S.createdAt) S.createdAt = todayStr();
      S.welcomed = true; ui.iepSid = s.id; ui.iepGid = 'new';
    }
    saveIepGoal({id:ui.form?.id, subj:fd.get('subj'), text:fd.get('text'), method:fd.get('method'),
      evalContext:fd.get('evalContext'), evalAction:fd.get('evalAction'), evaluation:fd.get('evaluation')});
  }
}

/* ===== 백업 ===== */
function exportData(){
  S.lastExport = todayStr(); save();
  const blob = new Blob([JSON.stringify(S, null, 1)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `업무수첩-백업-${todayStr().replace(/-/g,'')}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('백업 파일을 받았어요'); render();
}
$('#importFile').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!data || data.v !== 1 || !Array.isArray(data.students)) throw new Error('형식');
    if (!(await ask(`백업 파일을 불러올까요? 지금 이 기기에 있는 기록은 백업 내용으로 바뀌어요.\n(학생 ${data.students.length}명)`, '불러오기', false))) return;
    S = Object.assign(fresh(), data); save(); ui.form = null; toast('불러왔어요'); render();
  } catch(err){ toast('업무수첩 백업 파일이 아니에요'); }
});

window.addEventListener('hashchange', () => { const r = routeFromHash(); if (r !== curRoute){ curRoute = r; render(); } });
window.addEventListener('popstate', () => { const r = routeFromHash(); if (r !== curRoute){ curRoute = r; render(); } });
window.addEventListener('afterprint', () => { $('#printArea').innerHTML = ''; });
render();
</script>
